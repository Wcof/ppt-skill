<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PPT Skill 项目概览</title>
  <desc id="desc">从自然语言输入到 HTML 演示源文件，再导出 PDF、PPTX、MP4 和 GIF 的全流程概览。</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F1E3"/>
      <stop offset="100%" stop-color="#E8DFC7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0E1720" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B6A2F"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F4EFE2"/>
  <path d="M0 0H1280V220C1090 174 930 196 760 244C534 308 300 326 0 266V0Z" fill="url(#ink)"/>
  <path d="M0 622C184 572 346 585 512 622C732 671 948 676 1280 596V720H0V622Z" fill="#D7C6A4" opacity="0.45"/>

  <text x="72" y="90" font-family="Georgia, 'Noto Serif SC', serif" font-size="46" font-weight="700" fill="#F7F1E3">PPT Skill</text>
  <text x="72" y="136" font-family="'Noto Sans SC', Arial, sans-serif" font-size="24" fill="#D9C9AA">用对话生成演讲级 HTML PPT，并导出 PDF / PPTX / MP4 / GIF</text>

  <g filter="url(#softShadow)">
    <rect x="70" y="230" width="250" height="230" rx="18" fill="#FFFFFF"/>
    <rect x="70" y="230" width="250" height="10" rx="5" fill="#9B6A2F"/>
    <text x="98" y="286" font-family="'Noto Sans SC', Arial, sans-serif" font-size="26" font-weight="700" fill="#15212B">输入</text>
    <text x="98" y="330" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">主题 / 大纲 / 素材</text>
    <text x="98" y="366" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">分享场景与受众</text>
    <text x="98" y="402" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">视觉风格约束</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="405" y="190" width="470" height="310" rx="20" fill="url(#paper)"/>
    <text x="445" y="250" font-family="'Noto Sans SC', Arial, sans-serif" font-size="28" font-weight="700" fill="#15212B">Skill 工作流</text>
    <g font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#263238">
      <circle cx="462" cy="306" r="8" fill="#9B6A2F"/>
      <text x="484" y="313">明确输入与交付格式</text>
      <circle cx="462" cy="352" r="8" fill="#9B6A2F"/>
      <text x="484" y="359">选择单文件 / 多文件 / deck-stage 架构</text>
      <circle cx="462" cy="398" r="8" fill="#9B6A2F"/>
      <text x="484" y="405">建立主题、布局、动效和图片规则</text>
      <circle cx="462" cy="444" r="8" fill="#9B6A2F"/>
      <text x="484" y="451">生成 HTML 演示源文件并做 Playwright 验证</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="960" y="230" width="250" height="230" rx="18" fill="#FFFFFF"/>
    <rect x="960" y="230" width="250" height="10" rx="5" fill="#2F6F62"/>
    <text x="988" y="286" font-family="'Noto Sans SC', Arial, sans-serif" font-size="26" font-weight="700" fill="#15212B">输出</text>
    <text x="988" y="330" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">HTML 演示版</text>
    <text x="988" y="366" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">矢量 PDF</text>
    <text x="988" y="402" font-family="'Noto Sans SC', Arial, sans-serif" font-size="20" fill="#3A4650">可编辑 PPTX / 视频</text>
  </g>

  <path d="M335 345H380" stroke="#9B6A2F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M890 345H935" stroke="#9B6A2F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="'Noto Sans SC', Arial, sans-serif" font-size="17" fill="#5F513A">
    <rect x="208" y="560" width="864" height="62" rx="31" fill="#FFFFFF" opacity="0.82"/>
    <text x="250" y="599">核心价值：把 PPT 创作拆成可复用模板、设计规范、导出脚本和质量检查清单，让对话式生成也能稳定交付。</text>
  </g>
</svg>
